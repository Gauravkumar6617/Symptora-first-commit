[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.98",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
